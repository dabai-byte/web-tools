        <!-- Features -->
        <div class="mt-16 text-center">

            <div class="grid md:grid-cols-4 gap-6">

    <footer class="text-center py-6 text-gray-500 text-sm border-t border-gray-800">
        <p>© 2026 音频工具箱 | 所有处理均在浏览器本地完成</p>

    <script>
        // Web Audio API 处理音频
        let audioContext;
        
        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }
        
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
        
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 音频剪辑
        const trimZone = document.getElementById('trim-zone');
        const trimInput = document.getElementById('trim-input');
        const trimBtn = document.getElementById('trim-btn');
        const trimAudio = document.getElementById('trim-audio');
        const trimPreview = document.getElementById('trim-preview');
        const trimInfo = document.getElementById('trim-info');
        let trimFile = null;
        let trimDuration = 0;

        trimZone.addEventListener('click', () => trimInput.click());
        trimInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                trimFile = e.target.files[0];
                trimAudio.src = URL.createObjectURL(trimFile);
                trimPreview.classList.remove('hidden');
                trimBtn.disabled = false;
                
                trimAudio.onloadedmetadata = () => {
                    trimDuration = trimAudio.duration;
                    trimInfo.textContent = `时长: ${formatTime(trimDuration)}`;
                    document.getElementById('trim-end').value = Math.min(10, trimDuration).toFixed(1);
                    document.getElementById('trim-end').max = trimDuration;
                };
            }
        });

        trimBtn.addEventListener('click', async () => {
            if (!trimFile) return;
            trimBtn.textContent = '处理中...';
            trimBtn.disabled = true;
            
            try {
                const ctx = getAudioContext();
                const arrayBuffer = await trimFile.arrayBuffer();
                const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                
                const start = parseFloat(document.getElementById('trim-start').value);
                const end = parseFloat(document.getElementById('trim-end').value);
                
                const sampleRate = audioBuffer.sampleRate;
                const channels = audioBuffer.numberOfChannels;
                const startSample = Math.floor(start * sampleRate);
                const endSample = Math.floor(end * sampleRate);
                const length = endSample - startSample;
                
                const newBuffer = ctx.createBuffer(channels, length, sampleRate);
                
                for (let i = 0; i < channels; i++) {
                    const oldData = audioBuffer.getChannelData(i);
                    const newData = newBuffer.getChannelData(i);
                    for (let j = 0; j < length; j++) {
                        newData[j] = oldData[startSample + j];
                    }
                }
                
                // 导出为WAV
                const wav = audioBufferToWav(newBuffer);
                const blob = new Blob([wav], { type: 'audio/wav' });
                downloadBlob(blob, 'trimmed.wav');
                
                trimBtn.textContent = '✓ 剪辑完成！';
                setTimeout(() => {
                    trimBtn.textContent = '剪辑音频';
                    trimBtn.disabled = false;
                }, 2000);
            } catch (error) {
                alert('处理失败: ' + error.message);
                trimBtn.textContent = '剪辑音频';
                trimBtn.disabled = false;
            }
        });

        // 音量调整
        const volumeZone = document.getElementById('volume-zone');
        const volumeInput = document.getElementById('volume-input');
        const volumeBtn = document.getElementById('volume-btn');
        let volumeFile = null;

        volumeZone.addEventListener('click', () => volumeInput.click());
        volumeInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                volumeFile = e.target.files[0];
                document.getElementById('volume-audio').src = URL.createObjectURL(volumeFile);
                document.getElementById('volume-preview').classList.remove('hidden');
                volumeBtn.disabled = false;
            }
        });

        volumeBtn.addEventListener('click', async () => {
            if (!volumeFile) return;
            volumeBtn.textContent = '处理中...';
            volumeBtn.disabled = true;
            
            try {
                const ctx = getAudioContext();
                const arrayBuffer = await volumeFile.arrayBuffer();
                const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                
                const volume = parseFloat(document.getElementById('volume-range').value);
                const channels = audioBuffer.numberOfChannels;
                const length = audioBuffer.length;
                
                const newBuffer = ctx.createBuffer(channels, length, audioBuffer.sampleRate);
                
                for (let i = 0; i < channels; i++) {
                    const oldData = audioBuffer.getChannelData(i);
                    const newData = newBuffer.getChannelData(i);
                    for (let j = 0; j < length; j++) {
                        newData[j] = Math.max(-1, Math.min(1, oldData[j] * volume));
                    }
                }
                
                const wav = audioBufferToWav(newBuffer);
                const blob = new Blob([wav], { type: 'audio/wav' });
                downloadBlob(blob, 'volume_adjusted.wav');
                
                volumeBtn.textContent = '✓ 完成！';
                setTimeout(() => {
                    volumeBtn.textContent = '调整音量';
                    volumeBtn.disabled = false;
                }, 2000);
            } catch (error) {
                alert('处理失败: ' + error.message);
                volumeBtn.textContent = '调整音量';
                volumeBtn.disabled = false;
            }
        });

        // 音频合并
        const mergeZone = document.getElementById('merge-zone');
        const mergeInput = document.getElementById('merge-input');
        const mergeBtn = document.getElementById('merge-btn');
        const mergeList = document.getElementById('merge-list');
        let mergeFiles = [];

        mergeZone.addEventListener('click', () => mergeInput.click());
        mergeInput.addEventListener('change', (e) => {
            for (const file of e.target.files) {
                if (file.type.startsWith('audio/')) {
                    mergeFiles.push(file);
                }
            }
            updateMergeList();
        });

        function updateMergeList() {
            mergeList.innerHTML = mergeFiles.map((file, i) => `
                <div class="flex items-center justify-between bg-gray-700 p-3 rounded-lg">
                    <span class="text-sm truncate">${file.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-400">${formatSize(file.size)}</span>
                        <button onclick="removeMergeFile(${i})" class="text-red-400 hover:text-red-300">×</button>
                    </div>
                </div>
            `).join('');
            mergeBtn.disabled = mergeFiles.length < 2;
        }

        window.removeMergeFile = (i) => {
            mergeFiles.splice(i, 1);
            updateMergeList();
        };

        mergeBtn.addEventListener('click', async () => {
            if (mergeFiles.length < 2) return;
            mergeBtn.textContent = '处理中...';
            mergeBtn.disabled = true;
            
            try {
                const ctx = getAudioContext();
                const buffers = [];
                
                for (const file of mergeFiles) {
                    const arrayBuffer = await file.arrayBuffer();
                    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                    buffers.push(audioBuffer);
                }
                
                // 计算总长度
                const totalLength = buffers.reduce((sum, buf) => sum + buf.length, 0);
                const sampleRate = buffers[0].sampleRate;
                const channels = Math.max(...buffers.map(b => b.numberOfChannels));
                
                const newBuffer = ctx.createBuffer(channels, totalLength, sampleRate);
                
                let offset = 0;
                for (const buf of buffers) {
                    for (let i = 0; i < channels; i++) {
                        const sourceChannel = i < buf.numberOfChannels ? i : 0;
                        const sourceData = buf.getChannelData(sourceChannel);
                        const destData = newBuffer.getChannelData(i);
                        destData.set(sourceData, offset);
                    }
                    offset += buf.length;
                }
                
                const wav = audioBufferToWav(newBuffer);
                const blob = new Blob([wav], { type: 'audio/wav' });
                downloadBlob(blob, 'merged.wav');
                
                mergeBtn.textContent = '✓ 合并完成！';
                setTimeout(() => {
                    mergeBtn.textContent = '合并音频';
                    mergeBtn.disabled = mergeFiles.length < 2;
                }, 2000);
            } catch (error) {
                alert('处理失败: ' + error.message);
                mergeBtn.textContent = '合并音频';
                mergeBtn.disabled = mergeFiles.length < 2;
            }
        });

        // AudioBuffer 转 WAV
        function audioBufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            
            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;
            
            const dataLength = buffer.length * blockAlign;
            const bufferLength = 44 + dataLength;
            
            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);
            
            // WAV header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);
            
            // 写入音频数据
            const offset = 44;
            const channelData = [];
            for (let i = 0; i < numChannels; i++) {
                channelData.push(buffer.getChannelData(i));
            }
            
            let index = offset;
            for (let i = 0; i < buffer.length; i++) {
                for (let channel = 0; channel < numChannels; channel++) {
                    const sample = Math.max(-1, Math.min(1, channelData[channel][i]));
                    view.setInt16(index, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                    index += 2;
                }
            }
            
            return arrayBuffer;
        }
        
        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    </script>
