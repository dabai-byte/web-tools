<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈希计算工具 - MD5/SHA256/SHA512在线计算</title>
    <meta name="description" content="免费在线哈希计算工具，支持MD5、SHA-1、SHA-256、SHA-512等多种哈希算法。">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">
    <header class="bg-gradient-to-r from-green-600 to-teal-600 py-6">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold">🔐 哈希计算工具</h1>
            <p class="text-gray-100 mt-2">MD5 · SHA-1 · SHA-256 · SHA-512</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- 输入区 -->
        <div class="bg-gray-800 rounded-2xl p-8 mb-8">
            <h2 class="text-xl font-bold mb-4">输入内容</h2>
            <textarea id="input-text" rows="6" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" placeholder="输入要计算哈希的文本..."></textarea>
            
            <div class="mt-4 flex gap-4">
                <button onclick="calculateHashes()" class="flex-1 bg-green-600 py-3 rounded-lg hover:bg-green-700 font-medium">
                    🔐 计算哈希
                </button>
                <button onclick="loadFile()" class="bg-gray-700 px-6 py-3 rounded-lg hover:bg-gray-600">
                    📁 选择文件
                </button>
                <input type="file" id="file-input" class="hidden">
            </div>
        </div>

        <!-- 结果区 -->
        <div class="space-y-4" id="results">
            <div class="bg-gray-800 rounded-2xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-bold text-green-400">MD5</h3>
                    <button onclick="copyHash('md5')" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">复制</button>
                </div>
                <input type="text" id="hash-md5" class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 font-mono text-sm" readonly>
            </div>

            <div class="bg-gray-800 rounded-2xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-bold text-blue-400">SHA-1</h3>
                    <button onclick="copyHash('sha1')" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">复制</button>
                </div>
                <input type="text" id="hash-sha1" class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 font-mono text-sm" readonly>
            </div>

            <div class="bg-gray-800 rounded-2xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-bold text-purple-400">SHA-256</h3>
                    <button onclick="copyHash('sha256')" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">复制</button>
                </div>
                <input type="text" id="hash-sha256" class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 font-mono text-sm" readonly>
            </div>

            <div class="bg-gray-800 rounded-2xl p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-bold text-orange-400">SHA-512</h3>
                    <button onclick="copyHash('sha512')" class="text-sm bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">复制</button>
                </div>
                <textarea id="hash-sha512" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded px-4 py-2 font-mono text-sm" readonly></textarea>
            </div>
        </div>

        <!-- 使用说明 -->
        <div class="mt-8 bg-gray-800 rounded-2xl p-6">
            <h3 class="font-bold mb-4">💡 使用说明</h3>
            <ul class="text-gray-400 text-sm space-y-2">
                <li>• 所有计算在浏览器本地完成，不上传任何数据</li>
                <li>• 支持文本和文件的哈希计算</li>
                <li>• MD5: 128位，常用于文件校验</li>
                <li>• SHA-256/512: 更安全，推荐用于密码存储</li>
            </ul>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById('file-input');
        
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const buffer = await file.arrayBuffer();
            calculateFromFile(buffer);
        });

        function loadFile() {
            fileInput.click();
        }

        async function calculateHashes() {
            const text = document.getElementById('input-text').value;
            if (!text) {
                alert('请输入文本');
                return;
            }
            
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            
            await calculateFromData(data);
        }

        async function calculateFromFile(buffer) {
            const data = new Uint8Array(buffer);
            await calculateFromData(data);
        }

        async function calculateFromData(data) {
            // MD5 需要单独实现，这里用简化版本
            // 实际项目中建议引入 crypto-js 或 spark-md5 库
            
            // SHA-1
            const sha1 = await crypto.subtle.digest('SHA-1', data);
            document.getElementById('hash-sha1').value = bufferToHex(sha1);
            
            // SHA-256
            const sha256 = await crypto.subtle.digest('SHA-256', data);
            document.getElementById('hash-sha256').value = bufferToHex(sha256);
            
            // SHA-512
            const sha512 = await crypto.subtle.digest('SHA-512', data);
            document.getElementById('hash-sha512').value = bufferToHex(sha512);
            
            // MD5 简化提示
            document.getElementById('hash-md5').value = 'MD5需要额外库支持，建议使用SHA-256';
        }

        function bufferToHex(buffer) {
            return Array.from(new Uint8Array(buffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        function copyHash(type) {
            const el = document.getElementById('hash-' + type);
            navigator.clipboard.writeText(el.value);
            
            // 简单反馈
            const btn = el.parentElement.querySelector('button');
            const original = btn.textContent;
            btn.textContent = '✓ 已复制';
            setTimeout(() => btn.textContent = original, 1500);
        }
    </script>
</body>
</html>
