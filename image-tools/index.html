<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片工具箱 - 免费在线图片处理</title>
    <meta name="description" content="免费在线图片压缩、格式转换、调整大小，无需注册，即开即用">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white py-6">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold">🖼️ 图片工具箱</h1>
            <p class="text-green-100 mt-2">免费在线图片处理，无需注册</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-12">
        <div class="grid md:grid-cols-3 gap-8">
            <!-- 图片压缩 -->
            <div class="bg-white rounded-2xl p-8 card-shadow">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-6">
                    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-3">图片压缩</h2>
                <p class="text-gray-600 mb-6">减小图片文件大小，保持画质</p>
                <div id="compress-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-green-400 transition">
                    <input type="file" id="compress-input" accept="image/*" class="hidden">
                    <p class="text-gray-500">点击或拖拽上传图片</p>
                    <p class="text-xs text-gray-400 mt-2">支持 JPG、PNG、WebP</p>
                </div>
                <div id="compress-preview" class="mt-4 hidden">
                    <img id="compress-img" class="max-w-full rounded-lg">
                </div>
                <div class="mt-4">
                    <label class="block text-sm text-gray-600 mb-2">压缩质量: <span id="quality-val">80</span>%</label>
                    <input type="range" id="quality-range" min="10" max="100" value="80" class="w-full">
                </div>
                <button id="compress-btn" class="w-full mt-4 bg-green-600 text-white py-3 rounded-xl font-medium hover:bg-green-700 transition disabled:opacity-50" disabled>
                    压缩图片
                </button>
                <div id="compress-result" class="mt-4 text-sm text-gray-500"></div>
            </div>

            <!-- 格式转换 -->
            <div class="bg-white rounded-2xl p-8 card-shadow">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-3">格式转换</h2>
                <p class="text-gray-600 mb-6">转换图片格式为 JPG/PNG/WebP</p>
                <div id="convert-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-blue-400 transition">
                    <input type="file" id="convert-input" accept="image/*" class="hidden">
                    <p class="text-gray-500">点击或拖拽上传图片</p>
                </div>
                <div id="convert-preview" class="mt-4 hidden">
                    <img id="convert-img" class="max-w-full rounded-lg">
                </div>
                <div class="mt-4">
                    <label class="block text-sm text-gray-600 mb-2">目标格式</label>
                    <select id="format-select" class="w-full border rounded-lg px-4 py-2">
                        <option value="jpeg">JPG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
                <button id="convert-btn" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition disabled:opacity-50" disabled>
                    转换格式
                </button>
            </div>

            <!-- 调整大小 -->
            <div class="bg-white rounded-2xl p-8 card-shadow">
                <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mb-6">
                    <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-3">调整大小</h2>
                <p class="text-gray-600 mb-6">缩放图片到指定尺寸</p>
                <div id="resize-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center cursor-pointer hover:border-purple-400 transition">
                    <input type="file" id="resize-input" accept="image/*" class="hidden">
                    <p class="text-gray-500">点击或拖拽上传图片</p>
                </div>
                <div id="resize-preview" class="mt-4 hidden">
                    <img id="resize-img" class="max-w-full rounded-lg">
                    <p id="resize-dimensions" class="text-xs text-gray-400 mt-1"></p>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-2">宽度</label>
                        <input type="number" id="resize-width" class="w-full border rounded-lg px-4 py-2" placeholder="800">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-2">高度</label>
                        <input type="number" id="resize-height" class="w-full border rounded-lg px-4 py-2" placeholder="600">
                    </div>
                </div>
                <div class="mt-2">
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" id="keep-ratio" checked class="rounded">
                        保持宽高比
                    </label>
                </div>
                <button id="resize-btn" class="w-full mt-4 bg-purple-600 text-white py-3 rounded-xl font-medium hover:bg-purple-700 transition disabled:opacity-50" disabled>
                    调整大小
                </button>
            </div>
        </div>

        <!-- Features -->
        <div class="mt-16 text-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-8">为什么选择我们？</h2>
            <div class="grid md:grid-cols-4 gap-6">
                <div class="p-6">
                    <div class="text-3xl mb-3">🔒</div>
                    <h3 class="font-medium text-gray-800">隐私安全</h3>
                    <p class="text-sm text-gray-500 mt-2">图片处理在本地完成</p>
                </div>
                <div class="p-6">
                    <div class="text-3xl mb-3">⚡</div>
                    <h3 class="font-medium text-gray-800">快速处理</h3>
                    <p class="text-sm text-gray-500 mt-2">无需上传到服务器</p>
                </div>
                <div class="p-6">
                    <div class="text-3xl mb-3">💰</div>
                    <h3 class="font-medium text-gray-800">完全免费</h3>
                    <p class="text-sm text-gray-500 mt-2">无隐藏费用，无需注册</p>
                </div>
                <div class="p-6">
                    <div class="text-3xl mb-3">📱</div>
                    <h3 class="font-medium text-gray-800">跨平台</h3>
                    <p class="text-sm text-gray-500 mt-2">支持手机、平板、电脑</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-8">
        <div class="container mx-auto px-4 text-center">
            <p>© 2026 图片工具箱. All rights reserved.</p>
            <p class="text-sm mt-2">所有图片处理均在浏览器本地完成，不会上传到任何服务器</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
