<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码工具箱 - 免费在线二维码生成解析</title>
    <meta name="description" content="免费在线二维码生成器，支持批量生成、美化、解析。无需注册，即开即用。">
    <meta name="keywords" content="二维码生成,二维码解析,批量二维码,二维码美化">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">
    <header class="gradient-bg py-6">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold">📱 二维码工具箱</h1>
            <p class="text-gray-200 mt-2">生成 · 批量 · 美化 · 解析</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- Tab Navigation -->
        <div class="flex flex-wrap gap-2 mb-6 justify-center">
            <button onclick="showTab('generate')" class="tab-btn px-6 py-2 rounded-full bg-purple-600 text-white" data-tab="generate">生成二维码</button>
            <button onclick="showTab('batch')" class="tab-btn px-6 py-2 rounded-full bg-gray-700 text-gray-300" data-tab="batch">批量生成</button>
            <button onclick="showTab('beautify')" class="tab-btn px-6 py-2 rounded-full bg-gray-700 text-gray-300" data-tab="beautify">美化二维码</button>
            <button onclick="showTab('parse')" class="tab-btn px-6 py-2 rounded-full bg-gray-700 text-gray-300" data-tab="parse">解析二维码</button>
        </div>

        <!-- 生成二维码 -->
        <div id="tab-generate" class="tab-content max-w-2xl mx-auto">
            <div class="bg-gray-800 rounded-2xl p-8">
                <h2 class="text-xl font-bold mb-6">生成二维码</h2>
                
                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">内容类型</label>
                    <select id="qr-type" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" onchange="updatePlaceholder()">
                        <option value="text">纯文本</option>
                        <option value="url">网址链接</option>
                        <option value="wifi">WiFi连接</option>
                        <option value="contact">名片信息</option>
                        <option value="email">邮箱</option>
                        <option value="phone">电话</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">输入内容</label>
                    <textarea id="qr-content" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" placeholder="输入文本或网址"></textarea>
                </div>

                <div id="wifi-fields" class="hidden mb-4 space-y-3">
                    <input type="text" id="wifi-ssid" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" placeholder="WiFi名称 (SSID)">
                    <input type="password" id="wifi-password" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" placeholder="WiFi密码">
                    <select id="wifi-type" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2">
                        <option value="WPA">WPA/WPA2</option>
                        <option value="WEP">WEP</option>
                        <option value="nopass">无密码</option>
                    </select>
                </div>

                <div id="contact-fields" class="hidden mb-4 space-y-3">
                    <input type="text" id="contact-name" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" placeholder="姓名">
                    <input type="tel" id="contact-phone" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" placeholder="电话">
                    <input type="email" id="contact-email" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" placeholder="邮箱">
                    <input type="text" id="contact-company" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2" placeholder="公司">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">尺寸</label>
                        <select id="qr-size" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2">
                            <option value="128">128px (小)</option>
                            <option value="256" selected>256px (中)</option>
                            <option value="512">512px (大)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">容错级别</label>
                        <select id="qr-level" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2">
                            <option value="L">L - 7%</option>
                            <option value="M" selected>M - 15%</option>
                            <option value="Q">Q - 25%</option>
                            <option value="H">H - 30%</option>
                        </select>
                    </div>
                </div>

                <button onclick="generateQR()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-medium hover:bg-purple-700 transition">
                    生成二维码
                </button>

                <div id="qr-result" class="mt-6 text-center hidden">
                    <canvas id="qr-canvas"></canvas>
                    <div class="mt-4 flex gap-2 justify-center">
                        <button onclick="downloadQR('png')" class="px-4 py-2 bg-gray-700 rounded-lg hover:bg-gray-600">下载PNG</button>
                        <button onclick="downloadQR('svg')" class="px-4 py-2 bg-gray-700 rounded-lg hover:bg-gray-600">下载SVG</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 批量生成 -->
        <div id="tab-batch" class="tab-content hidden max-w-2xl mx-auto">
            <div class="bg-gray-800 rounded-2xl p-8">
                <h2 class="text-xl font-bold mb-6">批量生成二维码</h2>
                
                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">输入内容（每行一个）</label>
                    <textarea id="batch-content" rows="10" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 font-mono text-sm" placeholder="https://example1.com&#10;https://example2.com&#10;https://example3.com"></textarea>
                </div>

                <button onclick="batchGenerate()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition">
                    批量生成
                </button>

                <div id="batch-result" class="mt-6 grid grid-cols-3 gap-4"></div>
                <button id="batch-download-all" class="w-full mt-4 bg-gray-700 py-2 rounded-lg hover:bg-gray-600 hidden" onclick="downloadAllBatch()">
                    打包下载全部
                </button>
            </div>
        </div>

        <!-- 美化二维码 -->
        <div id="tab-beautify" class="tab-content hidden max-w-2xl mx-auto">
            <div class="bg-gray-800 rounded-2xl p-8">
                <h2 class="text-xl font-bold mb-6">美化二维码</h2>
                
                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">上传二维码图片</label>
                    <input type="file" id="beautify-input" accept="image/*" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2">
                </div>

                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">前景色</label>
                    <input type="color" id="fg-color" value="#000000" class="w-full h-10 rounded-lg">
                </div>

                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">背景色</label>
                    <input type="color" id="bg-color" value="#ffffff" class="w-full h-10 rounded-lg">
                </div>

                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">添加Logo</label>
                    <input type="file" id="logo-input" accept="image/*" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2">
                </div>

                <div id="beautify-preview" class="mt-4 text-center">
                    <canvas id="beautify-canvas" class="max-w-full"></canvas>
                </div>

                <button onclick="applyBeautify()" class="w-full mt-4 bg-pink-600 text-white py-3 rounded-xl font-medium hover:bg-pink-700 transition">
                    应用美化
                </button>
            </div>
        </div>

        <!-- 解析二维码 -->
        <div id="tab-parse" class="tab-content hidden max-w-2xl mx-auto">
            <div class="bg-gray-800 rounded-2xl p-8">
                <h2 class="text-xl font-bold mb-6">解析二维码</h2>
                
                <div class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-green-400 transition" id="parse-zone">
                    <input type="file" id="parse-input" accept="image/*" class="hidden">
                    <p class="text-gray-400">点击或拖拽上传二维码图片</p>
                </div>

                <div id="parse-preview" class="mt-4 text-center hidden">
                    <img id="parse-img" class="max-w-xs mx-auto rounded-lg">
                </div>

                <div id="parse-result" class="mt-6 bg-gray-700 rounded-lg p-4 hidden">
                    <label class="block text-sm text-gray-400 mb-2">解析结果</label>
                    <p id="parse-text" class="break-all"></p>
                    <button onclick="copyParseResult()" class="mt-3 px-4 py-2 bg-gray-600 rounded-lg hover:bg-gray-500">
                        📋 复制内容
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-gray-500 text-sm border-t border-gray-800">
        <p>© 2026 二维码工具箱 | 所有处理均在浏览器本地完成</p>
    </footer>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-purple-600', 'text-white');
                btn.classList.add('bg-gray-700', 'text-gray-300');
            });
            document.querySelector(`[data-tab="${tab}"]`).classList.remove('bg-gray-700', 'text-gray-300');
            document.querySelector(`[data-tab="${tab}"]`).classList.add('bg-purple-600', 'text-white');
        }

        function updatePlaceholder() {
            const type = document.getElementById('qr-type').value;
            const content = document.getElementById('qr-content');
            const wifiFields = document.getElementById('wifi-fields');
            const contactFields = document.getElementById('contact-fields');

            wifiFields.classList.add('hidden');
            contactFields.classList.add('hidden');
            content.parentElement.classList.remove('hidden');

            switch(type) {
                case 'text':
                    content.placeholder = '输入任意文本';
                    break;
                case 'url':
                    content.placeholder = 'https://example.com';
                    break;
                case 'wifi':
                    content.parentElement.classList.add('hidden');
                    wifiFields.classList.remove('hidden');
                    break;
                case 'contact':
                    content.parentElement.classList.add('hidden');
                    contactFields.classList.remove('hidden');
                    break;
                case 'email':
                    content.placeholder = 'example@email.com';
                    break;
                case 'phone':
                    content.placeholder = '+86 138 0000 0000';
                    break;
            }
        }

        function generateQR() {
            const type = document.getElementById('qr-type').value;
            let content = document.getElementById('qr-content').value;
            const size = parseInt(document.getElementById('qr-size').value);
            const level = document.getElementById('qr-level').value;

            // 构建内容
            if (type === 'wifi') {
                const ssid = document.getElementById('wifi-ssid').value;
                const password = document.getElementById('wifi-password').value;
                const wifiType = document.getElementById('wifi-type').value;
                content = `WIFI:T:${wifiType};S:${ssid};P:${password};;`;
            } else if (type === 'contact') {
                const name = document.getElementById('contact-name').value;
                const phone = document.getElementById('contact-phone').value;
                const email = document.getElementById('contact-email').value;
                const company = document.getElementById('contact-company').value;
                content = `MECARD:N:${name};TEL:${phone};EMAIL:${email};ORG:${company};;`;
            }

            if (!content) {
                alert('请输入内容');
                return;
            }

            const canvas = document.getElementById('qr-canvas');
            QRCode.toCanvas(canvas, content, {
                width: size,
                errorCorrectionLevel: level,
                margin: 2
            });

            document.getElementById('qr-result').classList.remove('hidden');
        }

        function downloadQR(format) {
            const canvas = document.getElementById('qr-canvas');
            if (format === 'png') {
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'qrcode.png';
                    a.click();
                });
            }
        }

        function batchGenerate() {
            const content = document.getElementById('batch-content').value;
            const lines = content.split('\n').filter(l => l.trim());
            
            if (lines.length === 0) {
                alert('请输入内容');
                return;
            }

            const result = document.getElementById('batch-result');
            result.innerHTML = '';

            lines.forEach((line, i) => {
                const div = document.createElement('div');
                div.className = 'text-center';
                const canvas = document.createElement('canvas');
                QRCode.toCanvas(canvas, line.trim(), { width: 150 });
                const label = document.createElement('p');
                label.className = 'text-xs text-gray-400 mt-1 truncate';
                label.textContent = line.trim().substring(0, 20);
                div.appendChild(canvas);
                div.appendChild(label);
                result.appendChild(div);
            });

            document.getElementById('batch-download-all').classList.remove('hidden');
        }

        // 解析二维码
        const parseZone = document.getElementById('parse-zone');
        const parseInput = document.getElementById('parse-input');
        
        parseZone.addEventListener('click', () => parseInput.click());
        parseInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const img = document.getElementById('parse-img');
                img.src = URL.createObjectURL(e.target.files[0]);
                document.getElementById('parse-preview').classList.remove('hidden');
                
                // 这里需要jsQR库来解析，简化提示
                document.getElementById('parse-result').classList.remove('hidden');
                document.getElementById('parse-text').textContent = '提示: 完整解析需要jsQR库支持';
            }
        });

        function copyParseResult() {
            const text = document.getElementById('parse-text').textContent;
            navigator.clipboard.writeText(text);
        }
    </script>
</body>
</html>
